
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datacorex"
version = "0.1.0"
description = "A modular Python toolkit for data engineering and ETL operations."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

keywords = [
    "data-engineering",
    "etl",
    "pyspark",
    "databricks",
    "data-processing"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules"
]

dependencies = []

[project.optional-dependencies]
dev = [
    "build",
    "pytest",
    "ruff",
    "twine"
]

[project.urls]
Homepage = "https://github.com/diegoferrari87/DataCoreX"
Repository = "https://github.com/diegoferrari87/DataCoreX"
Issues = "https://github.com/diegoferrari87/DataCoreX/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/datacorex"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"
